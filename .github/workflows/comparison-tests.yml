name: Comparison Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  comparison-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run comparison tests
        run: bun run test:comparison

      - name: Run comparison tests in record mode
        run: bun run test:comparison:record

      - name: diff
        run: git diff

      # Fail if there are any diffs
      - name: Fail if there are any diffs
        run: if [ -n "$(git diff --name-only)" ]; then exit 1; fi
